task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 5
remap_mscoco_category: False
use_amp: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/OPIXray/train/train_image
    ann_file: ./dataset/OPIXray/annotations/opixray_train.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - { type: RandomHorizontalFlip }
        - { type: Resize, size: [640, 640] }
        - { type: ConvertPILImage, dtype: float32, scale: True }
        - { type: ConvertBoxes, fmt: cxcywh, normalize: True }
  shuffle: True
  total_batch_size: 4
  num_workers: 2
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/OPIXray/test/test_image
    ann_file: ./dataset/OPIXray/annotations/opixray_test.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - { type: Resize, size: [640, 640] }
        - { type: ConvertPILImage, dtype: float32, scale: True }
        - { type: ConvertBoxes, fmt: cxcywh, normalize: True }
  shuffle: False
  total_batch_size: 4
  num_workers: 2
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
