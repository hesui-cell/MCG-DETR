task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 15
remap_mscoco_category: False
use_amp: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/PIXray_coco/train
    ann_file: ./dataset/PIXray_coco/annotations/pixray_train.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - { type: RandomHorizontalFlip }
        - { type: Resize, size: [512, 512] }
        - { type: ConvertPILImage, dtype: float32, scale: True }
        - { type: ConvertBoxes, fmt: cxcywh, normalize: True }
  shuffle: True
  total_batch_size: 4
  num_workers: 2
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/PIXray_coco/test
    ann_file: ./dataset/PIXray_coco/annotations/pixray_test.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - { type: Resize, size: [640, 640] }
        - { type: ConvertPILImage, dtype: float32, scale: True }
  shuffle: False
  total_batch_size: 4
  num_workers: 2
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction